# Tests on every push and pull request. Author: Kishan Tiwari <kishantiwari@iitkgp.ac.in>
name: Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-22.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt libraries
        run: sudo apt-get update && sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libegl1 libgl1 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements.txt
      - name: Analysis and format checks
        run: for t in test_analysis.py test_analysis2.py test_analysis3.py test_analysis4.py test_analysis5.py test_analysis6.py test_analysis7.py test_analysis8.py test_formats.py; do python "$t"; done
      - name: Module self-checks
        run: python -c "from plotbench import thermobaro, volcanic, geochron, mineral, norm, fetioxide, cellformula as c; [m._demo() for m in (thermobaro, volcanic, geochron, mineral, norm, fetioxide, c)]"
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Validation against published values
        run: python validation/validate.py
