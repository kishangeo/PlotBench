# Builds PlotBench for Windows, macOS and Linux and attaches the files to the GitHub release of the pushed tag.
# Author: Kishan Tiwari <kishantiwari@iitkgp.ac.in>
name: Build and release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:  # the full test set once; no installer is built or published unless it passes
    runs-on: ubuntu-22.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libegl1 libgl1 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements.txt
      - name: Analysis and format checks
        run: for t in test_analysis.py test_analysis2.py test_analysis3.py test_analysis4.py test_analysis5.py test_analysis6.py test_analysis7.py test_analysis8.py test_formats.py; do python "$t"; done
      - name: Module self-checks
        run: python -c "from plotbench import thermobaro, volcanic, geochron, mineral, norm, fetioxide, cellformula as c; [m._demo() for m in (thermobaro, volcanic, geochron, mineral, norm, fetioxide, c)]"
      - name: Regression tests
        run: python -m unittest discover -s tests -v
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-intel
          - os: ubuntu-22.04
            target: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libegl1 libgl1 libfontconfig1 libdbus-1-3
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Self-checks
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python test_analysis.py
          python test_formats.py
          python -c "from plotbench import thermobaro, volcanic, geochron, mineral; thermobaro._demo(); volcanic._demo(); geochron._demo(); mineral._demo()"
      - name: Version
        id: v
        shell: bash
        run: echo "ver=$(python -c 'import re;print(re.search(r"VERSION = \"(.+?)\"", open("plotbench/app.py").read()).group(1))')" >> "$GITHUB_OUTPUT"
      - name: Build (Windows installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --windowed --name PlotBench --icon plotbench\assets\icon.ico `
            --add-data "plotbench\assets;plotbench\assets" --add-data "plotbench\examples;plotbench\examples" --add-data "plotbench\manual;plotbench\manual" --add-data "CHANGELOG.md;." `
            --hidden-import matplotlib.backends.backend_pdf --hidden-import matplotlib.backends.backend_ps --hidden-import matplotlib.backends.backend_svg `
            --hidden-import PIL.TiffImagePlugin --hidden-import pywt --hidden-import h5py --hidden-import xlrd --hidden-import scipy.odr `
            --exclude-module tkinter run_plotbench.py
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/Odist" installer.iss
      - name: Build (macOS app and disk image)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --windowed --name PlotBench --icon plotbench/assets/logo.png \
            --osx-bundle-identifier io.github.kishangeo.plotbench \
            --add-data "plotbench/assets:plotbench/assets" --add-data "plotbench/examples:plotbench/examples" --add-data "plotbench/manual:plotbench/manual" --add-data "CHANGELOG.md:." \
            --hidden-import matplotlib.backends.backend_pdf --hidden-import matplotlib.backends.backend_ps --hidden-import matplotlib.backends.backend_svg \
            --hidden-import PIL.TiffImagePlugin --hidden-import pywt --hidden-import h5py --hidden-import xlrd --hidden-import scipy.odr \
            --exclude-module tkinter run_plotbench.py
          # ad-hoc signature (free; not Apple notarisation): Apple silicon refuses unsigned code, and the bundle's seal is consistent
          codesign --force --deep --sign - dist/PlotBench.app
          codesign --verify --deep dist/PlotBench.app || echo "::warning::ad-hoc signature did not verify"
          cp packaging/macos/README-FIRST.txt dist/
          mkdir dmg && cp -R dist/PlotBench.app dmg/ && cp dist/README-FIRST.txt dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname PlotBench -srcfolder dmg -ov -format UDZO "dist/PlotBench-${{ steps.v.outputs.ver }}-${{ matrix.target }}.dmg"
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --noconfirm --windowed --name PlotBench \
            --add-data "plotbench/assets:plotbench/assets" --add-data "plotbench/examples:plotbench/examples" --add-data "plotbench/manual:plotbench/manual" --add-data "CHANGELOG.md:." \
            --hidden-import matplotlib.backends.backend_pdf --hidden-import matplotlib.backends.backend_ps --hidden-import matplotlib.backends.backend_svg \
            --hidden-import PIL.TiffImagePlugin --hidden-import pywt --hidden-import h5py --hidden-import xlrd --hidden-import scipy.odr \
            --exclude-module tkinter run_plotbench.py
          cp plotbench/assets/logo.png dist/PlotBench/plotbench.png
          cp packaging/linux/install.sh dist/PlotBench/ && chmod +x dist/PlotBench/install.sh
          tar -C dist -czf "dist/PlotBench-${{ steps.v.outputs.ver }}-${{ matrix.target }}.tar.gz" PlotBench
      - name: Smoke test (Linux build starts)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: timeout 20 dist/PlotBench/PlotBench || [ $? -eq 124 ]
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*-Setup.exe
            dist/*.dmg
            dist/*.tar.gz
